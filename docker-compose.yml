version: '3.9'

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartshop-sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -Q 'SELECT 1' -No
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartshop-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # Kafka (KRaft mode — không cần Zookeeper). 2 listener: PLAINTEXT cho host (dotnet run local),
  # DOCKER cho container khác trong network (backend, sau này là inventory-service/notification-service).
  kafka:
    image: apache/kafka:3.8.0
    container_name: smartshop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # Cụm chỉ có 1 broker: mặc định của Kafka là 3 bản sao cho topic nội bộ nên không tạo được __consumer_offsets,
      # dẫn tới không có group coordinator và consumer nào cũng không vào được group (Kafka UI không thấy group nào).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smartshop-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # Inventory Service DB — Postgres riêng, không dùng chung SQL Server của Core.
  # Host port 5433 (tránh trùng Postgres cài sẵn trên máy); container khác trong compose dùng postgres-inventory:5432.
  postgres-inventory:
    image: postgres:16-alpine
    container_name: smartshop-postgres-inventory
    environment:
      POSTGRES_DB: smartshop_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: "${INVENTORY_DB_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - inventorydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d smartshop_inventory"]
      interval: 5s
      retries: 10

  # Notification Service DB — SQL Server riêng, instance riêng dù cùng engine với Core (không dùng chung `sqlserver`).
  # Host port 1434 (tránh trùng SQL Server Core ở 1433); container khác trong compose dùng sqlserver-notification:1433.
  sqlserver-notification:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartshop-sqlserver-notification
    environment:
      SA_PASSWORD: "${NOTIFICATION_DB_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - notificationdata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${NOTIFICATION_DB_SA_PASSWORD}" -Q 'SELECT 1' -No
      interval: 10s
      retries: 10

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: src/SmartShop.WebAPI/Dockerfile
    container_name: smartshop-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: "Asia/Ho_Chi_Minh"   # container Linux mặc định UTC — khớp giờ VN cho log + DateTime.Now
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SmartShop;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Enabled: "true"
      Cache__Provider: "Redis"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "SmartShop"
      Jwt__Audience: "SmartShopClients"
      Jwt__ExpiresInMinutes: "60"
      Groq__ApiKey: "${GROQ_API_KEY}"
      Groq__Model: "llama-3.3-70b-versatile"
      Cors__AllowedOrigins: "http://localhost:3000"
      Kafka__BootstrapServers: "kafka:29092"
      Grpc__InventoryServiceUrl: "http://inventory-service:8080"   # h2c, không TLS
      Internal__NotifyApiKey: "${INTERNAL_NOTIFY_API_KEY}"   # xác thực POST /api/internal/notify từ notification-service
      VNPay__TmnCode: "${VNPAY_TMN_CODE}"
      VNPay__HashSecret: "${VNPAY_HASH_SECRET}"
      VNPay__PayUrl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VNPay__ReturnUrl: "http://localhost:8080/api/payments/vnpay/callback"
      VNPay__FrontendResultUrl: "http://localhost:3000/payment/result"
      Email__Enabled: "true"
      Email__SmtpHost: "${EMAIL_SMTP_HOST}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT}"
      Email__Username: "${EMAIL_USERNAME}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__FromName: "SmartShop"
      Email__FromAddress: "noreply@smartshop.dev"
    volumes:
      - uploads:/app/wwwroot/images/products  # persist uploaded images
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Inventory Service — gRPC h2c, service độc lập với Core.
  # Host port 5290 → container 8080. Migrate + seed tự chạy lúc start (Seed__Enabled).
  inventory-service:
    build:
      context: .
      dockerfile: src/Services/Inventory/SmartShop.Inventory.API/Dockerfile
    container_name: smartshop-inventory
    ports:
      - "5290:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__InventoryDb: "Host=postgres-inventory;Port=5432;Database=smartshop_inventory;Username=inventory;Password=${INVENTORY_DB_PASSWORD}"
      Seed__Enabled: "true"
      Grpc__EnableReflection: "true"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Notification Service — Kafka consumer fan-out, không có REST public. Đẩy realtime bằng cách gọi ngược
  # POST /api/internal/notify ở Core (kênh REST nội bộ, xem docs/architecture/microservices-boundaries.md).
  notification-service:
    build:
      context: .
      dockerfile: src/Services/Notification/SmartShop.Notification.API/Dockerfile
    container_name: smartshop-notification
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: "Asia/Ho_Chi_Minh"   # container Linux mặc định UTC — khớp giờ VN cho log + backoff retry email dễ đối chiếu
      ConnectionStrings__NotificationDb: "Server=sqlserver-notification;Database=SmartShopNotificationDb;User Id=sa;Password=${NOTIFICATION_DB_SA_PASSWORD};TrustServerCertificate=True;"
      Kafka__BootstrapServers: "kafka:29092"
      Internal__CoreBaseUrl: "http://backend:8080"
      Internal__ApiKey: "${INTERNAL_NOTIFY_API_KEY}"
      Email__Enabled: "true"
      Email__SmtpHost: "${EMAIL_SMTP_HOST}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT}"
      Email__Username: "${EMAIL_USERNAME}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__FromName: "SmartShop"
      Email__FromAddress: "noreply@smartshop.dev"
    depends_on:
      sqlserver-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./smartshop-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8080/api"
    container_name: smartshop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqldata: {}
  redisdata: {}
  uploads: {}   # uploaded product images
  inventorydata: {}
  notificationdata: {}